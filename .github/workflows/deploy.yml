# Build backend/frontend images, push to ECR, roll ECS Fargate services.
# Auth: IAM user access keys (not OIDC).
#
# GitHub → Settings → Secrets and variables → Actions → Secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Same names as Variables or Secrets (vars first, then secrets):
#   AWS_REGION          e.g. us-east-1
#   ECR_API             ACCOUNT.dkr.ecr.REGION.amazonaws.com/llm-playground-api
#   ECR_WEB             ACCOUNT.dkr.ecr.REGION.amazonaws.com/llm-playground-web
#   ECS_CLUSTER         e.g. llm-playground
#   ECS_SERVICE_API     e.g. api
#   ECS_SERVICE_WEB     e.g. web
#   VITE_API_URL        public API origin, no trailing slash
#
# OPENROUTER_API_KEY stays in AWS Secrets Manager on the API task, not here.

name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

jobs:
  deploy-api:
    name: API → ECR → ECS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push API image
        working-directory: backend
        env:
          ECR_API: ${{ vars.ECR_API }}
        run: |
          docker build -t "$ECR_API:${{ github.sha }}" -t "$ECR_API:latest" .
          docker push "$ECR_API:${{ github.sha }}"
          docker push "$ECR_API:latest"

      - name: Deploy API service
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE_API: ${{ vars.ECS_SERVICE_API }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE_API" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE_API"

  deploy-web:
    name: Frontend → ECR → ECS
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push web image
        working-directory: frontend
        env:
          ECR_WEB: ${{ vars.ECR_WEB }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Set VITE_API_URL (variable or secret) to the public API origin."
            exit 1
          fi
          docker build \
            --build-arg "VITE_API_URL=$VITE_API_URL" \
            -t "$ECR_WEB:${{ github.sha }}" \
            -t "$ECR_WEB:latest" \
            .
          docker push "$ECR_WEB:${{ github.sha }}"
          docker push "$ECR_WEB:latest"

      - name: Deploy web service
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE_WEB: ${{ vars.ECS_SERVICE_WEB }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE_WEB" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE_WEB"
